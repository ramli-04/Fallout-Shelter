name: essaim

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: 128
      OLLAMA_GPU_OVERHEAD: ${OLLAMA_GPU_OVERHEAD:-2147483648}
      LLAMA_ARG_FIT_TARGET: ${LLAMA_ARG_FIT_TARGET:-2048}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  model-pull:
    image: ollama/ollama:latest
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:1b}"]
    depends_on:
      ollama:
        condition: service_healthy

  ai-service:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      INFERENCE_TIMEOUT: ${INFERENCE_TIMEOUT:-30}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.3}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-128}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-3}
      LLM_PER_MODEL_CONCURRENCY: ${LLM_PER_MODEL_CONCURRENCY:-1}
      LLM_QUEUE_LIMIT: ${LLM_QUEUE_LIMIT:-128}
      LLM_QUEUE_TIMEOUT: ${LLM_QUEUE_TIMEOUT:-20}
      LLM_POOL_MODE: ${LLM_POOL_MODE:-multi}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-llama3.2:1b}
      LLM_AUTO_SINGLE: ${LLM_AUTO_SINGLE:-false}
      AI_MEMORY_BUDGET_GB: ${AI_MEMORY_BUDGET_GB:-10}
    volumes:
      - ./outputs/ai_backend_runs:/app/outputs/ai_backend_runs
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)); assert data['status'] in ('CONNECTED', 'DEGRADED'), data['status']"
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 20s

volumes:
  ollama_models:
